name: score-tools

# Scores code-intelligence tools against the corpus (issue #135). Never runs on push or pull
# request and is never a required check: a tool's result is a result, not a gate. Each run indexes
# a lane with the tool, asks the corpus's questions through the tool's adapter (bench/adapters/),
# scores the answers (bench/score/), and writes the per-surface table to the job summary. The
# answer file and the full report are kept as an artifact.
#
# Lanes are added to a tool's matrix only after its non-passes on that lane have been read, so a
# number is never published for a lane the adapter has not been checked on.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: score-tools
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  skybox:
    name: skybox (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [php, rust, typescript, javascript, python, go]
    env:
      SKYBOX_VERSION: "0.9.0"
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      # The public npm package; its platform build comes in as an optional dependency.
      - name: Install skybox ${{ env.SKYBOX_VERSION }} (pinned)
        run: |
          npm install --prefix "$RUNNER_TEMP/skybox" --no-save --no-audit --no-fund "@skylence-ai/skybox@${SKYBOX_VERSION}"
          "$RUNNER_TEMP/skybox/node_modules/.bin/skybox" --version

      - name: Ask (lane scope; raw protocol, anchored for the other surfaces)
        run: >
          node bench/adapters/skybox/run.mjs
          --lane "$LANE"
          --skybox "$RUNNER_TEMP/skybox/node_modules/.bin/skybox"
          --version "$SKYBOX_VERSION"
          --out "skybox-$LANE.json"

      - name: Score
        run: |
          node bench/score/score.mjs --lane "$LANE" --answers "skybox-$LANE.json" > "skybox-$LANE.report.txt"
          node bench/score/score.mjs --lane "$LANE" --answers "skybox-$LANE.json" --format json > "skybox-$LANE.report.json"
          counts=$(node -e 'const cs=require(process.argv[1]).summary.columns;console.log(cs.map((k)=>`${k.class==="exact"?"exact":"recall-only"}${k.protocol?", "+k.protocol:""}: ${k.asked} asked, ${k.notAsked} not asked, of ${k.scorable} scorable`).join("; "))' "$PWD/skybox-$LANE.report.json")
          {
            echo "### skybox ${SKYBOX_VERSION}, lane ${LANE}, scope lane, corpus ${GITHUB_SHA::7}"
            echo
            echo "Protocol raw (definition, resolution, import-precision): lookup by bare name, skybox is asked \`context(name)\` with the task's \`from.symbol\` and never sees the \`from\` line, so a name that is not unique in the lane is answered with every candidate, which fails unless the key lists the others as known sites. Protocol anchored (hover, call_hierarchy, references, implementation, cardinality, multi-parent): asked within the \`from\` file, the node at the \`from\` line is the subject. Protocol file (document_symbol): every node skybox records in the file. Direction: the two-sided kinds anchored and asked both ways; declaration_merge raw. Parse-negative and diagnostics: unsupported (skybox reports no per-file parse failure). Each line is one rule class and one protocol; the lines are separate measures and are never added up. ${counts}."
            echo
            echo '```'
            sed -n '/^surface /,$p' "skybox-$LANE.report.txt"
            echo '```'
            echo
            echo "Per-task verdicts are in the artifact skybox-${LANE}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the answers and the report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: skybox-${{ matrix.lane }}
          path: |
            skybox-${{ matrix.lane }}.json
            skybox-${{ matrix.lane }}.report.txt
            skybox-${{ matrix.lane }}.report.json
          if-no-files-found: ignore

  codebase-memory-mcp:
    name: codebase-memory-mcp (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [go, typescript, javascript, python]
    env:
      CBM_VERSION: "0.12.1"
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      # The public npm package; its platform build comes in as an optional dependency.
      - name: Install codebase-memory-mcp ${{ env.CBM_VERSION }} (pinned)
        run: |
          npm install --prefix "$RUNNER_TEMP/cbm" --no-save --no-audit --no-fund "codebase-memory-mcp@${CBM_VERSION}"
          "$RUNNER_TEMP/cbm/node_modules/.bin/codebase-memory-mcp" --version

      - name: Ask (lane scope; raw protocol, file protocol for document_symbol and the parse behaviour)
        run: >
          node bench/adapters/codebase-memory-mcp/run.mjs
          --lane "$LANE"
          --cbm "$RUNNER_TEMP/cbm/node_modules/.bin/codebase-memory-mcp"
          --version "$CBM_VERSION"
          --out "cbm-$LANE.json"

      - name: Score
        run: |
          node bench/score/score.mjs --lane "$LANE" --answers "cbm-$LANE.json" > "cbm-$LANE.report.txt"
          node bench/score/score.mjs --lane "$LANE" --answers "cbm-$LANE.json" --format json > "cbm-$LANE.report.json"
          counts=$(node -e 'const cs=require(process.argv[1]).summary.columns;console.log(cs.map((k)=>`${k.class==="exact"?"exact":k.class==="behaviour"?"behaviour":"recall-only"}${k.protocol?", "+k.protocol:""}: ${k.asked} asked, ${k.notAsked} not asked, of ${k.scorable} scorable`).join("; "))' "$PWD/cbm-$LANE.report.json")
          {
            echo "### codebase-memory-mcp ${CBM_VERSION}, lane ${LANE}, scope lane, corpus ${GITHUB_SHA::7}"
            echo
            echo "Protocol raw (definition, resolution, import-precision): one \`search_graph\` call by bare name, every node of that name is the answer; the tool never sees the \`from\` line. Protocol file (document_symbol): \`get_file_outline\`; (parse-negative, diagnostics): the files \`index_repository\` reports as partially parsed. The anchored surfaces are not asked yet. Each line is one rule class and one protocol; the lines are separate measures and are never added up. ${counts}."
            echo
            echo '```'
            sed -n '/^surface /,$p' "cbm-$LANE.report.txt"
            echo '```'
            echo
            echo "Per-task verdicts are in the artifact cbm-${LANE}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the answers and the report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cbm-${{ matrix.lane }}
          path: |
            cbm-${{ matrix.lane }}.json
            cbm-${{ matrix.lane }}.report.txt
            cbm-${{ matrix.lane }}.report.json
          if-no-files-found: ignore
